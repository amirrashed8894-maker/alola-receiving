<details><summary>1) أول ما العربية توصل – فحص العربية (قبل التنزيل)</summary><ol>
<li>سجّل الوقت ورقم العربية والسواق والمزرعة، ووزّن العربية قائم على الميزان.</li>
<li>الغطاء: العربية متغطية بمشمع/شبك؟ الثمار المكشوفة للشمس أكتر من ساعتين بتسخن وتتلسع وده من أهم مسببات الأعفان بعدين.</li>
<li>حرارة الثمار: المس أو قيس بترمومتر ثمرة من الطبقة العليا ومن الوسط. ثمرة سخنة (أكتر من ~30°م) = نزّل بسرعة في الظل.</li>
<li>النظافة: أرضية العربية، مفيش زيت أو سماد أو كيماويات أو تراب كتير.</li>
<li>الصناديق: مكسورة؟ متعبية فوق الحافة (ضغط وكدمات)؟ صناديق وسخة أو فيها بقايا ثمار قديمة؟</li>
<li>الريحة: ريحة تخمر عند فتح الغطاء = إنذار (ثمار سخنت أو اتجرحت)، ركّز على عينة الوسط والقاع.</li>
<li>الثمار مبلولة (مطر/ندى/رش)؟ الثمار المبلولة والمجروحة هي الأكثر عرضة للعفن في التخزين – سجّلها كمسبب.</li>
<li>سجّل كل ده في خطوة «فحص العربية» في البرنامج.</li></ol></details>
<details><summary>2) سحب العينة (أهم خطوة)</summary><ol>
<li>العينة لازم تمثل العربية كلها: صناديق من <b>القدام والنص والورا</b>، ومن <b>الطبقة العليا والوسطى والسفلى</b>، ومن الجنبين.</li>
<li>عدد الصناديق: عربية حتى 300 صندوق ← 6 صناديق، 300–500 ← 8، أكتر من 500 ← 10 (قاعدة تقريبية ≈ جذر عدد الصناديق ÷ 3، البرنامج بيحسبها).</li>
<li>اخلط الصناديق المسحوبة على ترابيزة وخد عشوائي <b>200 ثمرة</b> على الأقل (أو 100 ثمرة من كل جزء: قدام/نص/ورا).</li>
<li>متختارش بعينك الثمار الحلوة أو الوحشة – خد اللي ييجي في إيدك.</li>
<li>لو فيه شك في جزء من العربية (ريحة، بلل) اعمله عينة لوحده.</li></ol></details>
<details><summary>3) ترتيب الفحص على العينة</summary><ol>
<li>وزّن العينة كلها (كجم) واعدّ الثمار ← متوسط وزن الثمرة.</li>
<li>الخام بيوصل من غير عفن – افصل الأول الثمار اللي فيها <b>مسبب عفن</b> (نتشة، كدمة، جرح، بقع زيتية، لين…) وصنّف السبب.</li>
<li>بعدها افصل العيوب: كل ثمرة تتسجل مرة واحدة تحت <b>أكبر عيب فيها</b>.</li>
<li>بعدها قيس الأحجام لكل العينة حسب الصنف والعبوات اللي اخترتهم في أول خطوة. العربية الواحدة ممكن فيها أكثر من عبوة لنفس الصنف (مثلاً أبوسرة في أوبن توب 7 ك ومقفول 7 ك مع بعض) — اختار كل العبوات الموجودة، وعدّ مقاسات كل عبوة لوحدها. البرتقال (أبوسرة وصيفي وبلدي نفس المقاسات) أوبن توب 7 ك 20–32، مقفول 7 ك 36–48، مقفول 14/15 ك والجامبو 36…125، الليمون 14/15 ك 72…216. الأفندي (كلمنتينا، فريمونت، موركوت) بالوزن على ميزان جرامات، ولو فيه أكتر من وزن صندوق اختارهم كلهم. جنب كل مقاس بيظهر القطر ووزن الحبة التقريبي بخط خفيف. نسبة التصدير بتتحسب على العينة كلها: في برتقال 14/15 ك والجامبو، مقاس 125 بيتكتب ويتقاس عادي لكنه خارج التصدير (التصدير بيقف عند 113).</li>
<li>اختياري: سكر (بريكس) بالرفراكتومتر، حموضة، نسبة عصير، ولون القشرة (درجة من 1 أخضر إلى 5 برتقالي كامل).</li>
<li>صوّر الثمار المعيبة والصناديق بتاريخ ورقم العربية.</li></ol></details>
<details><summary>4) مسببات الأعفان (أهم بند في القرار)</summary><ul>
<li><b>عفن السرة</b> (أبوسرة): سرة مفتوحة أو غامقة من بره – بتعفن من جوه في التخزين.</li>
<li><b>البقع الزيتية</b>: بقع خضرا/بني حوالين غدد الزيت من قطف أو نقل الثمار وهي مليانة مية (الصبح بدري أو بعد ري).</li>
<li><b>القطف الغائر (نتشة)</b>: العنق متشد واتقطع معاه جزء من القشرة – جرح مفتوح.</li>
<li><b>الكدمات</b>: مكان طري أو مضغوط من رمي أو ضغط الصناديق.</li>
<li><b>الجروح والخدش العميق</b>: أي جرح بيوصل للبياض – أكبر باب لدخول العفن.</li>
<li><b>ذبابة الفاكهة</b>: نقطة لسعة صغيرة غامقة وحواليها لون باهت.</li>
<li><b>الليونة / التبحير</b>: ثمرة طرية أو قشرة منفوخة منفصلة عن اللب – عمرها قصير.</li>
<li><b>تشققات</b>، <b>لسعة شمس شديدة</b>، <b>ثمار مبللة</b>، وأي مسبب تاني تحت «أخرى».</li></ul></details>
<details><summary>5) القرار</summary><ul>
<li>البرنامج بيطلع قرار: <b>قبول</b> / <b>قبول مع خصم</b> / <b>رفض</b> حسب نسبة مسببات الأعفان ونسبة التصدير.</li>
<li>الحدود الافتراضية (مسببات أعفان ≤3% قبول، ≤8% قبول بخصم، أكتر رفض) أرقام عملية متعارف عليها وليست مواصفة رسمية – عدّلها في الإعدادات حسب اتفاقك مع المورّد.</li>
<li>كل ثمرة فيها مسبب ممكن تعفن بعد أيام في التخزين – العربية اللي مسبباتها عالية شغّلها أول.</li></ul></details>
